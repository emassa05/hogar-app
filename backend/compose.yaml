name: hogar-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hogar
      POSTGRES_PASSWORD: hogar
      POSTGRES_DB: hogar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogar -d hogar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hogar:hogar@postgres:5432/hogar
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
