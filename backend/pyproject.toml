[project]
name = "hogar-app-backend"
version = "0.1.0"
description = "hogar-app REST API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "fastapi>=0.118",
    "limits[async-redis]>=5.5",
    "phonenumbers>=9.0",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "redis>=6.4",
    "sqlalchemy[asyncio]>=2.0.43",
    "twilio>=9.8",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PTH", "C4", "PT", "TID"]
ignore = ["B008", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["twilio.*", "phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
