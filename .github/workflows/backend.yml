name: Backend

on:
  pull_request:
    branches: [dev, main]
    paths:
      - backend/**
  push:
    branches: [dev, main]
    paths:
      - backend/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hogar
          POSTGRES_PASSWORD: hogar
          POSTGRES_DB: hogar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hogar -d hogar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hogar:hogar@localhost:5432/hogar
      TEST_DATABASE_URL: postgresql+asyncpg://hogar:hogar@localhost:5432/hogar_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      SMS_PROVIDER: console
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app tests

      - name: Create test database
        run: psql -h localhost -U hogar -d hogar -c "CREATE DATABASE hogar_test OWNER hogar"
        env:
          PGPASSWORD: hogar

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations match models
        run: uv run alembic check

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag hogar-app-backend:ci .
