name: hogar_app
description: AplicaciÃ³n mÃ³vil para organizar las tareas del hogar.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.4'

dependencies:
  dio: 5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 9.2.4
  freezed_annotation: 2.4.4
  go_router: 15.1.3
  intl: 0.20.2
  json_annotation: 4.9.0
  riverpod_annotation: 2.6.1
  uuid: 4.5.1

dev_dependencies:
  build_runner: 2.4.15
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.8
  json_serializable: 6.9.5
  riverpod_generator: 2.6.4

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus-jakarta-sans-400.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-sans-500.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta-sans-600.ttf
          weight: 600
        - asset: assets/fonts/plus-jakarta-sans-800.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono-500.ttf
          weight: 500
        - asset: assets/fonts/jetbrains-mono-600.ttf
          weight: 600
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/instrument-serif-italic.ttf
          style: italic
